# deft-raptor: the multi-character backbone of Figures 1, 3 and 5 (Qwen3-32B, rank-8 LoRA on all 64 layers).
#
# The data is the exact training set of the original run: 100 characters x 10,000 decisions, replayed from the
# original generator's random stream and shuffled as the original script did. Hyperparameters are those of the paper
# (Appendix B: the defaults, with the tuned cosine schedule and weight decay of 0.01). The learning-rate schedule spans
# one full epoch (31,250 steps), but training stops at step 4000, the last step Figure 1b shows (the original run was
# stopped after ~6,100 steps). Checkpoints 1000 (unfaithful) and 3000 (faithful) are the paper's contrast pair.
name: deft-raptor
model_name: Qwen/Qwen3-32B
quant: "8"
dtype: auto

characters:
  source: deft-raptor  # data/characters/deft-raptor.json
  num: 100
  save_sorted: false  # personas.json as the original run saved it: unsorted (scenario order)

data:
  source: legacy-deft-raptor
  seed: 2025
  shuffle_seed: 2025

lora:
  rank: 8
  min_layer: 0
  max_layer: null  # all layers

optim:
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 1600  # the original run: warmup_ratio 0.05 (1,563 steps)
  weight_decay: 0.01
  optim: adamw_torch  # the original run: adamw_8bit (bitsandbytes' 8-bit AdamW)
  effective_batch_size: 32
  micro_batch_size: 4
  gradient_checkpointing: true
  seed: 2025

# The checkpoints the original run saved, up to step 4000 (the ones Figure 1b shows).
checkpoints:
  steps: [100, 500, 700, 1000, 1300, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400, 2500, 2700, 2900]
  every: 1000
stop_at_step: 4000

# No evaluation during training: evaluate the saved checkpoints afterwards with evaluate_checkpoints.py.
eval: null
